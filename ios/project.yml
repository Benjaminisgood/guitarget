name: Guitarget
options:
  bundleIdPrefix: app.guitarget
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GuitargetKit:
    path: ../

targets:
  Guitarget:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GuitargetKit
        product: GuitarCore
      - package: GuitargetKit
        product: GuitarAudio
    settings:
      base:
        PRODUCT_NAME: Guitarget
        PRODUCT_BUNDLE_IDENTIFIER: app.guitarget.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Guitarget 需要麦克风来听你弹奏的吉他，用于调音、和弦识别与练习判定。音频只在本机分析，不会上传。"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  Guitarget-iOS:
    build:
      targets:
        Guitarget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
